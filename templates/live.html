<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiến độ chấm — OTTv2</title>
  <style>
    :root { font-family: Inter, system-ui, "Segoe UI", sans-serif; color:#172033; background:#f4f6fb; }
    * { box-sizing:border-box; }
    body { max-width:1100px; margin:0 auto; padding:28px 18px 48px; }
    header,.row { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    header { margin-bottom:20px; }
    h1 { margin:0; font-size:clamp(1.6rem,4vw,2.2rem); }
    h2 { margin:0; font-size:1.1rem; }
    a { color:#4f46e5; }
    .brand { color:#4f46e5; font-weight:800; letter-spacing:.12em; font-size:.78rem; margin-bottom:7px; }
    .card { background:#fff; border:1px solid #e3e8f1; border-radius:14px; padding:18px; margin:14px 0; box-shadow:0 8px 24px #1e293b08; }
    .hint { color:#657188; line-height:1.5; }
    .status { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin:16px 0; }
    .stat { padding:12px; background:#f6f7fb; border-radius:9px; }
    .stat small { display:block; color:#69758a; margin-bottom:5px; }
    .stat strong { overflow-wrap:anywhere; }
    input { width:100%; max-width:420px; padding:10px 12px; border:1px solid #d8deea; border-radius:8px; font:inherit; }
    button { border:0; background:#4f46e5; color:#fff; padding:10px 14px; border-radius:9px; font:inherit; font-weight:700; cursor:pointer; }
    .table-wrap { overflow-x:auto; margin-top:12px; }
    table { width:100%; border-collapse:collapse; min-width:540px; }
    th,td { text-align:left; padding:9px 8px; border-bottom:1px solid #edf0f5; }
    th { color:#647087; font-size:.86rem; }
    .empty { padding:16px; color:#69758a; background:#f6f7fb; border-radius:9px; }
    @media(max-width:600px) { body { padding:18px 12px 36px; } }
  </style>
</head>
<body>
  <header>
    <div><div class="brand">OTTv2 · LIVE SCORING</div><h1>Tiến độ chấm</h1></div>
    <nav><a href="/">Trang thi đấu</a> · <a href="/admin">Ban tổ chức</a></nav>
  </header>
  <section class="card">
    <div class="row"><h2 id="heading">Đang tải snapshot…</h2><span id="updated" class="hint"></span></div>
    <div id="progress" class="status"></div>
    <p class="hint">Trang đọc snapshot JSON chỉ-đọc, được máy chủ cập nhật khoảng 20 giây một lần. Trong lúc chấm, nhập tên để xem tiến độ cá nhân; bảng của bạn hiện khi bảng chấm xong. Tất cả bảng hiện khi ngày chấm hoàn tất.</p>
    <form id="entrant-form">
      <label for="entrant-name">Tên thi đấu</label>
      <div class="row">
        <input id="entrant-name" type="text" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" placeholder="Nhập tên thí sinh">
        <button type="submit">Xem tiến độ</button>
      </div>
    </form>
  </section>
  <section id="personal" class="card" aria-live="polite"></section>
  <section id="groups" aria-live="polite"></section>
<script>
  const $ = id => document.getElementById(id);
  const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
  let snapshot = null;
  let loading = false;

  function renderGroups(groups) {
    $("groups").innerHTML = groups.length ? groups.map(group => {
      const rows = group.entrants.map(entrant =>
        `<tr><td>${entrant.rank}</td><td>${esc(entrant.name)}</td><td>${entrant.pts}</td><td>${entrant.gs}</td><td>${entrant.matches_played}</td></tr>`
      ).join("");
      return `<section class="card"><div class="row"><h2>Bảng ${esc(group.group)}</h2><span class="hint">${group.matches_played} trận đã chấm</span></div>
        <div class="table-wrap"><table><thead><tr><th>Hạng</th><th>Thí sinh</th><th>Điểm trận</th><th>Điểm ván</th><th>Trận đã chấm</th></tr></thead><tbody>${rows}</tbody></table></div>
      </section>`;
    }).join("") : "";
  }

  function render(data) {
    const name = $("entrant-name").value.trim().toLowerCase();
    const personal = data.players?.[name];
    $("updated").textContent = data.generated_at
      ? `Snapshot lúc ${new Date(data.generated_at * 1000).toLocaleTimeString()}`
      : "";

    if (data.state === "complete") {
      $("heading").textContent = `Vòng ${data.round} · Ngày ${data.day} · Đã chấm xong`;
      $("progress").innerHTML = [
        ["Tiến độ lượt", `${data.completed_rounds}/${data.total_rounds}`],
        ["Trận đã chấm", `${data.completed_matches}/${data.total_matches}`],
        ["Số bảng", data.groups.length],
      ].map(([label,value]) => `<div class="stat"><small>${esc(label)}</small><strong>${esc(value)}</strong></div>`).join("");
      $("personal").innerHTML = `<p class="hint">Ngày chấm đã hoàn tất. Bảng xếp hạng của tất cả các bảng được hiển thị bên dưới.</p>`;
      renderGroups(data.groups);
      return;
    }

    $("heading").textContent = data.state === "idle"
      ? "Đang chờ lượt chấm"
      : `Vòng ${data.round} · Ngày ${data.day}${data.state === "failed" ? " · Chấm bị lỗi" : " · Đang chấm"}`;
    $("progress").innerHTML = [
      ["Tiến độ lượt", `${data.completed_rounds}/${data.total_rounds}`],
      ["Trận toàn giải đã chấm", `${data.completed_matches}/${data.total_matches}`],
    ].map(([label,value]) => `<div class="stat"><small>${esc(label)}</small><strong>${esc(value)}</strong></div>`).join("");
    renderGroups([]);

    if (!name) {
      $("personal").innerHTML = `<div class="empty">Nhập tên thi đấu để xem tiến độ cá nhân. Bảng xếp hạng đang được giữ lại đến khi bảng chấm xong.</div>`;
      return;
    }
    if (!personal) {
      $("personal").innerHTML = `<div class="empty">Không tìm thấy tên này trong bảng của vòng hiện tại. Kiểm tra lại tên thi đấu.</div>`;
      return;
    }

    const stateText = {
      waiting: "Lượt chấm chưa bắt đầu.",
      queued: `Ước tính còn ${personal.queue_ahead} trận xếp trước trận của bạn trong hàng hiện tại.`,
      complete: "Trận của bạn ở lượt hiện tại đã có kết quả.",
      bye: "Bạn được miễn đấu ở lượt hiện tại.",
      failed: "Tiến trình chấm đang gặp lỗi.",
    }[personal.state] || "Đang cập nhật tiến độ.";
    $("personal").innerHTML = `<h2>Tiến độ của ${esc(personal.name)} · Bảng ${esc(personal.group)}</h2>
      <div class="status">
        <div class="stat"><small>Trận của bạn</small><strong>${personal.matches_played}/${personal.total_matches}</strong></div>
        <div class="stat"><small>Trận đã chấm trong bảng</small><strong>${personal.group_matches_played}/${personal.group_matches_total}</strong></div>
        <div class="stat"><small>Trận còn trong bảng</small><strong>${personal.group_matches_remaining}</strong></div>
        <div class="stat"><small>Lượt còn đến khi xong bảng</small><strong>${personal.group_rounds_remaining}</strong></div>
      </div>
      <p class="hint">${esc(stateText)} Trận được chấm song song nên số trận xếp trước chỉ là ước tính, không phải thời gian chờ chính xác.</p>
      ${personal.group_complete ? `<p class="hint">Bảng của bạn đã chấm xong. Bảng xếp hạng tạm được hiển thị bên dưới.</p>` : ""}`;
    if (personal.group_complete) {
      renderGroups(data.groups.filter(group => group.group === personal.group));
    }
  }

  async function refresh() {
    if (loading) return;
    loading = true;
    try {
      const response = await fetch("/live-board.json");
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      snapshot = await response.json();
      render(snapshot);
    } catch (error) {
      $("heading").textContent = "Không tải được snapshot";
      $("personal").innerHTML = `<div class="empty">${esc(error.message)}</div>`;
    } finally {
      loading = false;
      window.setTimeout(refresh, 15000 + Math.random() * 5000);
    }
  }

  $("entrant-form").addEventListener("submit", event => {
    event.preventDefault();
    const name = $("entrant-name").value.trim();
    if (name) localStorage.setItem("ott-live-entrant-name", name);
    if (snapshot) render(snapshot);
    else refresh();
  });
  $("entrant-name").value = localStorage.getItem("ott-live-entrant-name") || "";
  window.setTimeout(refresh, Math.random() * 10000);
</script>
</body>
</html>
